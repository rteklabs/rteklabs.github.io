name: Deploy site with Google Maps config

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether Maps key is configured
        id: maps_key
        env:
          PROPERTY_MAP_GOOGLE_API_KEY: ${{ secrets.PROPERTY_MAP_GOOGLE_API_KEY }}
        run: |
          if [ -n "$PROPERTY_MAP_GOOGLE_API_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Maps key not configured; skipping Pages deployment.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.maps_key.outputs.configured == 'true'
        uses: actions/configure-pages@v5
      - name: Prepare static site and browser Maps config
        if: steps.maps_key.outputs.configured == 'true'
        env:
          PROPERTY_MAP_GOOGLE_API_KEY: ${{ secrets.PROPERTY_MAP_GOOGLE_API_KEY }}
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key = os.environ.get('PROPERTY_MAP_GOOGLE_API_KEY', '')
          if not key:
              raise SystemExit('Set the PROPERTY_MAP_GOOGLE_API_KEY repository Actions secret before deploying.')
          config = 'window.PROPERTY_MAP_CONFIG = ' + json.dumps({'apiKey': key}) + ';\n'
          Path('_site/property-map/config.js').write_text(config, encoding='utf-8')
          PY
      - if: steps.maps_key.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        if: steps.maps_key.outputs.configured == 'true'
        uses: actions/deploy-pages@v4
