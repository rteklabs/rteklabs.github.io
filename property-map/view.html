<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#405a73" />
  <title>Property Spot Map</title>
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div class="shell" id="viewerApp">
  <div class="topbar">
    <div class="brand"><div class="brandmark">P</div><div>Property Spot Map<div class="small">Client view</div></div></div>
    <div class="row"><button class="btn ghost tiny" id="viewModeBtn">▤ Listing</button><button class="btn ghost tiny" id="langBtn">中文</button><button class="btn tiny" id="copyLinkBtn">Copy link</button></div>
  </div>
  <main class="panel mapwrap readOnlyViewer">
    <div id="map"><div class="mapPlaceholder" id="mapPlaceholder">Loading property map…</div></div>
    <div class="clientbar">
      <div class="pill homeReturn" id="homeReturnBtn" role="button" tabindex="0" aria-label="Return to property" title="Return to property">
        <strong id="clientTopTitle">Property Spot Map</strong><div class="small" id="clientTopRef"></div>
      </div>
      <div class="pill hideMobile"><span class="small" id="clientCount">0 places</span></div>
    </div>
    <section class="clientSheet sheetHalf" id="clientSheet">
      <div class="sheetHandle" id="sheetHandle" role="button" tabindex="0" aria-label="Resize nearby places panel" aria-expanded="true">
        <span class="sheetHandleBar"></span>
      </div>
      <h1 class="clientTitle" id="clientHomeName">Property</h1>
      <div class="clientAddress" id="clientHomeAddress"></div>
      <div class="summary" id="clientIntro"></div>
      <div class="routePanel" id="routePanel" hidden>
        <div class="routeTop">
          <div class="routeText">
            <div class="routeDirectionLabel" id="routeDirectionLabel"></div>
            <div class="routeSummary" id="routeSummary">Calculating route…</div>
          </div>
          <button class="routeReverseBtn" id="routeReverseBtn" type="button" aria-label="Reverse direction" title="Reverse direction">⇄</button>
        </div>
        <div class="routeModes" id="routeModes">
          <button class="routeModeBtn active" type="button" data-route-mode="DRIVING" aria-pressed="true"><span>🚗</span><span>Drive</span></button>
          <button class="routeModeBtn" type="button" data-route-mode="WALKING" aria-pressed="false"><span>🚶</span><span>Walk</span></button>
        </div>
        <div class="routeWarning" id="routeWarning" hidden></div>
        <div class="routeStatus" id="routeStatus" aria-live="polite"></div>
      </div>
      <div class="clientListToolbar">
        <span id="clientListLabel">Nearby places</span>
        <button class="btn ghost tiny" type="button" id="expandCardsBtn">⛶ Expand</button>
      </div>
      <div class="categoryFilterWrap">
        <button class="filterScrollBtn filterScrollLeft" id="filterScrollLeft" type="button" aria-label="Scroll categories left">‹</button>
        <div class="categoryFilters" id="categoryFilters" aria-label="Point of interest categories"></div>
        <button class="filterScrollBtn filterScrollRight" id="filterScrollRight" type="button" aria-label="Scroll categories right">›</button>
      </div>
      <div class="clientPoiList" id="clientPoiList"></div>
    </section>
  </main>
  <section class="placesPage" id="placesPage" hidden>
    <div class="placesHero">
      <div class="placesHeroTop"><button class="btn ghost tiny" type="button" id="collapseCardsBtn">← Map</button></div>
      <div class="placesEyebrow" id="placesEyebrow">All nearby places</div>
      <h1 class="placesTitle" id="placesHomeName">Property</h1>
      <div class="placesAddress" id="placesHomeAddress"></div>
      <div class="placesIntro" id="placesIntro"></div>
      <div class="placesMeta" id="placesMeta"></div>
    </div>
    <div class="placesFilterBar">
      <div class="categoryFilters placesCategoryFilters" id="placesCategoryFilters" aria-label="Point of interest categories"></div>
    </div>
    <div class="placesGrid" id="placesGrid"></div>
  </section>
  <section class="googleListingPage" id="googleListingPage" hidden>
    <div class="googleListingHero">
      <div class="placesEyebrow" id="googleListingEyebrow">Google Listing</div>
      <h1 class="placesTitle" id="googleListingHomeName">Property</h1>
      <div class="placesAddress" id="googleListingHomeAddress"></div>
      <div class="googleListingMeta" id="googleListingMeta"></div>
    </div>
    <div class="googleListingStatus" id="googleListingStatus">Open Listing to load Google place cards.</div>
    <div class="googleListingHost" id="googleListingHost"></div>
  </section>
  <footer class="siteFooter"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></footer>
</div>
<script src="config.js"></script>
<script src="api-config.js"></script>
<script src="view.js?v=23"></script>
</body>
</html>
